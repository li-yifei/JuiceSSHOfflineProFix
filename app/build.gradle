plugins { id 'com.android.application' }

android {
    namespace 'org.lyf.juicesshofflinepro'
    compileSdk 36

    defaultConfig {
        applicationId 'org.lyf.juicesshofflinepro'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(project.property('RELEASE_STORE_FILE'))
                storePassword project.property('RELEASE_STORE_PASSWORD')
                keyAlias project.property('RELEASE_KEY_ALIAS')
                keyPassword project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:101.0.0'
}
